# Rheocles HTTP API — OpenAPI
#
# Hand-authored and first-class (spec §14): CI starts the real daemon and
# validates live responses against this file, so "current with the code" is
# enforced. The WebSocket transport carries the same operations with the same
# bodies and statuses — see docs/PROTOCOL.md for the frame encoding.
openapi: 3.1.0
info:
  title: Rheocles
  version: 0.1.0
  description: >
    Records any number of input streams simultaneously, each in its own file,
    on one cue. Local only (for now); bearer token always.
servers:
  - url: http://127.0.0.1:7447
security:
  - bearer: []
# Events, as delivered on GET /events (SSE `data:` lines) and to every
# authenticated WebSocket client — the same bytes on both.
# The WebSocket transport (ws://127.0.0.1:7448) carries every operation above
# and every event, full duplex. Not an OpenAPI `path`; described here.
x-websocket:
  url: ws://127.0.0.1:7448/
  auth:
    description: >
      The first frame must authenticate; until it does, every command is
      answered 401 and no event is delivered. A browser WebSocket cannot set
      an Authorization header, so the frame is the only way.
    request: { auth: '<token>' }
    response: { id: null, status: 200, body: { authenticated: true } }
  request:
    description: One JSON object per text frame. `id` is echoed untouched; method, path, query and body are the HTTP request's.
    example: { id: 4, method: POST, path: /takes, query: {}, body: { name: Episode 12 } }
  response:
    description: >
      `status` is the HTTP status the same command would give. A JSON body is
      inline in `body`; a binary body (a preview JPEG) comes as `base64` with
      its `contentType` instead.
    example: { id: 4, status: 201, body: { take: { id: 20260912T040433-fd9q, state: created } } }
    binaryExample: { id: 16, status: 200, contentType: image/jpeg, base64: '/9j/4AAQSk…' }
  events:
    description: Unsolicited frames with an `event` key and no `id`; the same objects GET /events delivers (see x-events).
x-events:
  - event: levels
    description: Per-stream peak level (audio, dBFS), frames written, drift, frames dropped and measured frame rate, ~4x/s while recording.
    example: { event: levels, take: 20260912T045007-5kqn, streams: [ { id: 'camera:0x2300000fd9009c', levelDb: null, framesWritten: 24000, drift: -0.5, framesDropped: 3916, measuredFrameRate: 59.94, paddingOff: true } ] }
  - event: marker
    description: A marker was added to the active take.
    example: { event: marker, take: 20260912T045007-5kqn, marker: { t: 2.042, label: chapter 1 } }
  - event: stalled
    description: An armed or recording stream stopped delivering frames.
    example: { event: stalled, stream: { id: 'camera:0x2300000fd9009c', kind: camera, name: Elgato 4K X, model: UVC Camera VendorID_4057 ProductID_156, capabilities: { video: { width: 3840, height: 2160, maxFrameRate: 30 } }, armed: true, active: { video: { width: 1280, height: 720, maxFrameRate: 30 } }, framesSeen: 0 } }
  - event: overloaded
    description: A recording stream is dropping more than ~5% of frames over the last 10 s — the encoder cannot keep up. The file stays constant-rate (drops become duplicated frames); `dropRate` is the fraction over the window.
    example: { event: overloaded, stream: { id: 'camera:0x2300000fd9009c', kind: camera, name: Elgato 4K X, model: UVC Camera VendorID_4057 ProductID_156, capabilities: { video: { width: 3840, height: 2160, maxFrameRate: 60 } }, armed: true, active: { video: { width: 3840, height: 2160, maxFrameRate: 60 } }, framesSeen: 24000 }, dropRate: 0.16 }
  - event: settings
    description: The daemon's settings changed.
    example: { event: settings, settings: { outputRoot: /Users/gopher/Movies/Rheocles, codec: prores } }
  - event: take
    description: A take changed state — created, recording, complete or incomplete. Carries the manifest, with `removed` set on the final event for a take that recorded nothing and was discarded (superseded before start, or created at shutdown) — a prepared take never reaches disk.
    example: { event: take, take: { id: 20260912T040433-fd9q, name: Episode 12, state: recording, created: '2026-09-12T04:04:33.235Z', started: '2026-09-12T04:04:33.347Z', outputRoot: /Users/gopher/Movies/Rheocles, destination: takes/2026-09-11/210433-episode-12, version: 0.1.0, machine: { hostname: lens-macbook-pro.local, machineId: CD3B7EE5-5E6C-5155-854A-72E4728555F7 }, streams: [], markers: [], settings: { codec: hevc } } }
  - event: stream
    description: A stream's armed state changed.
    example: { event: stream, stream: { id: 'microphone:BuiltInMicrophoneDevice', kind: microphone, name: MacBook Pro Microphone, model: Digital Mic, capabilities: { audio: { sampleRate: 48000, channels: 1 } }, armed: true, active: { audio: { sampleRate: 48000, channels: 1 } }, framesSeen: 0 } }
paths:
  /:
    get:
      operationId: discovery
      summary: Who this daemon is, where files go, how much room there is.
      responses:
        '200':
          description: Discovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-ws:
        request: { id: 1, method: GET, path: / }
        response: { id: 1, status: 200, body: { name: Rheocles, version: 0.1.0, hostname: lens-macbook-pro.local, machineId: CD3B7EE5-5E6C-5155-854A-72E4728555F7, outputRoot: /Users/gopher/Movies/Rheocles, freeBytes: 44878079167, auth: bearer, ports: { http: 7447, ws: 7448 } } }
  /streams:
    get:
      operationId: listStreams
      summary: Every stream with its armed state, plus what macOS lets this process see.
      responses:
        '200':
          description: Streams, in a fixed order — displays, windows, cameras, microphones, system audio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-ws:
        request: { id: 2, method: GET, path: /streams }
        response: { id: 2, status: 200, body: { streams: [], permissions: { camera: authorized, microphone: authorized, screen: authorized } } }
  /streams/{id}/arm:
    post:
      operationId: armStream
      summary: Make a device live (frames flow and are discarded) or release it. Never stamps, never writes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [armed]
              additionalProperties: false
              properties:
                armed:
                  type: boolean
      responses:
        '200':
          description: The stream as it now is. Idempotent in both directions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: macOS has not granted this process the device class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The device is gone, busy, or refused the configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 3, method: POST, path: '/streams/camera:0x2300000fd9009c/arm', body: { armed: true } }
        response: { id: 3, status: 200, body: { id: 'camera:0x2300000fd9009c', kind: camera, name: Elgato 4K X, model: UVC Camera VendorID_4057 ProductID_156, capabilities: { video: { width: 3840, height: 2160, maxFrameRate: 30 } }, armed: true, active: { video: { width: 1280, height: 720, maxFrameRate: 120 } }, framesSeen: 0 } }
  /streams/disarm:
    post:
      operationId: disarmAll
      summary: Disarm every armed stream at once — the "disarm all" button. Refused while a take is recording.
      responses:
        '200':
          description: The stream list after disarming, same shape as GET /streams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A take is recording (code `take_active`); stop it first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 18, method: POST, path: /streams/disarm }
        response: { id: 18, status: 200, body: { streams: [], permissions: { camera: authorized, microphone: authorized, screen: authorized } } }
  /takes:
    post:
      operationId: createTake
      summary: Prepare a take — snapshot the armed set, reserve paths, pre-flight the disk. The take lives in memory as `created`; nothing is written to disk until start.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeRequest'
      responses:
        '201':
          description: The manifest (state `created`) and any pre-flight warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Destination already exists (code `conflict`), or a take is recording (code `take_active`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '507':
          description: The disk pre-flight refused the take.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 4, method: POST, path: /takes, body: { name: Episode 12, expectedDuration: 3600 } }
        response: { id: 4, status: 201, body: { take: { id: 20260912T040433-fd9q, name: Episode 12, state: created, created: '2026-09-12T04:04:33.235Z', outputRoot: /Users/gopher/Movies/Rheocles, destination: takes/2026-09-11/210433-episode-12, version: 0.1.0, machine: { hostname: lens-macbook-pro.local, machineId: CD3B7EE5-5E6C-5155-854A-72E4728555F7 }, streams: [ { id: 'microphone:AppleUSBAudioEngine_Focusrite_Scarlett_2i2_USB_Y8CABR91C1CA8A_1_2', kind: microphone, name: Scarlett 2i2 USB, model: 'Scarlett 2i2 USB:1235:8210', path: scarlett-2i2-usb.wav, codec: pcm_s24le, format: { audio: { sampleRate: 48000, channels: 2 } }, framesWritten: 0, events: [] } ], markers: [], settings: { codec: hevc, expectedDuration: 3600 } }, warnings: [] } }
    get:
      operationId: listTakes
      summary: Recent takes, newest first.
      responses:
        '200':
          description: Up to 50 summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TakeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-ws:
        request: { id: 5, method: GET, path: /takes }
        response: { id: 5, status: 200, body: [ { id: 20260912T040433-fd9q, name: Episode 12, state: complete, created: '2026-09-12T04:04:33.235Z', destination: takes/2026-09-11/210433-episode-12, streams: 5 } ] }
  /takes/{id}:
    get:
      operationId: getTake
      summary: The manifest — live while recording, from disk afterwards.
      parameters:
        - $ref: '#/components/parameters/takeId'
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-ws:
        request: { id: 6, method: GET, path: /takes/20260912T040433-fd9q }
        response: { id: 6, status: 200, body: { id: 20260912T040433-fd9q, state: recording } }
  /takes/{id}/start:
    post:
      operationId: startTake
      summary: The cue. Every armed stream's writer starts on frames that are already flowing.
      parameters:
        - $ref: '#/components/parameters/takeId'
      responses:
        '200':
          description: The manifest, now `recording`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The take is not `created`, or is not the active take.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 7, method: POST, path: /takes/20260912T040433-fd9q/start }
        response: { id: 7, status: 200, body: { id: 20260912T040433-fd9q, state: recording, started: '2026-09-12T04:04:33.347Z' } }
  /takes/{id}/stop:
    post:
      operationId: stopTake
      summary: Finalize every writer and the manifest. Streams stay armed.
      parameters:
        - $ref: '#/components/parameters/takeId'
      responses:
        '200':
          description: The final manifest — `complete`, or `incomplete` with a reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The take is not `recording`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 8, method: POST, path: /takes/20260912T040433-fd9q/stop }
        response: { id: 8, status: 200, body: { id: 20260912T040433-fd9q, state: complete, stopped: '2026-09-12T04:04:35.402Z' } }
  /record:
    post:
      operationId: record
      summary: Create and start in one call — the popover's Record button.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeRequest'
      responses:
        '201':
          description: The manifest (state `recording`) and any pre-flight warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Destination already exists (code `conflict`), or a take is recording (code `take_active`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '507':
          description: The disk pre-flight refused the take.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 9, method: POST, path: /record, body: { name: quick } }
        response: { id: 9, status: 201, body: { take: { id: 20260912T040500-k2pm, state: recording }, warnings: [] } }
  /takes/{id}/join:
    post:
      operationId: joinStream
      summary: Start one stream's writer inside a running take, arming it first if cold. Stamped with the time it began.
      parameters:
        - $ref: '#/components/parameters/takeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRef'
      responses:
        '200':
          description: The manifest with the joined stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The take is not recording, or the stream is already recording in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 10, method: POST, path: /takes/20260912T045007-5kqn/join, body: { stream: 'microphone:BuiltInMicrophoneDevice' } }
        response: { id: 10, status: 200, body: { id: 20260912T045007-5kqn, state: recording } }
  /takes/{id}/leave:
    post:
      operationId: leaveStream
      summary: Finalize one stream's file; the stream stays armed and the take continues for the others.
      parameters:
        - $ref: '#/components/parameters/takeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRef'
      responses:
        '200':
          description: The manifest with that stream finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The take is not recording, or the stream is not recording in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 11, method: POST, path: /takes/20260912T045007-5kqn/leave, body: { stream: 'microphone:BuiltInMicrophoneDevice' } }
        response: { id: 11, status: 200, body: { id: 20260912T045007-5kqn, state: recording } }
  /takes/{id}/markers:
    post:
      operationId: addMarker
      summary: Append a marker at the current cue offset. Rheocles stamps when; the client says what.
      parameters:
        - $ref: '#/components/parameters/takeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label:
                  type: string
      responses:
        '200':
          description: The manifest with the marker appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The take is not recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 12, method: POST, path: /takes/20260912T045007-5kqn/markers, body: { label: chapter 1 } }
        response: { id: 12, status: 200, body: { id: 20260912T045007-5kqn, markers: [ { t: 2.042, label: chapter 1 } ] } }
  /settings:
    get:
      operationId: getSettings
      summary: The daemon's output root and default codec.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-ws:
        request: { id: 13, method: GET, path: /settings }
        response: { id: 13, status: 200, body: { outputRoot: /Users/gopher/Movies/Rheocles, codec: hevc, combine: false } }
    patch:
      operationId: patchSettings
      summary: Change the output root and/or default codec. The root cannot move while a take is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                outputRoot:
                  type: string
                  description: Absolute path.
                codec:
                  type: string
                  enum: [hevc, prores]
                combine:
                  type: boolean
                  description: Default `combine` for new takes.
      responses:
        '200':
          description: The full settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The output root cannot change while a take is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 14, method: PATCH, path: /settings, body: { codec: prores, combine: true } }
        response: { id: 14, status: 200, body: { outputRoot: /Users/gopher/Movies/Rheocles, codec: prores, combine: true } }
  /takes/{id}/reveal:
    post:
      operationId: revealTake
      summary: Reveal the take folder in the Finder, or a file within it. Daemon-side.
      parameters:
        - $ref: '#/components/parameters/takeId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: string
                  description: >
                    A file within the take folder to select, relative to it.
                    Omitted or empty reveals the folder itself. Must stay
                    within the folder and must exist.
      responses:
        '204':
          description: The Finder has been asked to reveal the target. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such take, or `path` names nothing within it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 15, method: POST, path: /takes/20260912T040433-fd9q/reveal, body: { path: combined.mov } }
        response: { id: 15, status: 204 }
  /reveal:
    post:
      operationId: reveal
      summary: Reveal any file or folder under the output root in the Finder. Daemon-side.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: string
                  description: >
                    Path relative to the output root. Omitted or empty reveals
                    the output root itself. Must stay under the root and must
                    exist.
      responses:
        '204':
          description: The Finder has been asked to reveal the target. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`path` names nothing under the output root.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 16, method: POST, path: /reveal, body: { path: takes/2026-09-11 } }
        response: { id: 16, status: 204 }
  /takes/{id}/combine:
    post:
      operationId: combineTake
      summary: >
        Passthrough-mux a take into `combined.mov` after the fact — the one
        video (if any) plus every audio stream as its own track. Starts the
        mux and returns immediately with `combined.state` `pending`;
        completion (`complete`, or `failed` with a reason) arrives as a `take`
        event. Allowed on `complete` and `incomplete` takes; a second call
        while one is pending is idempotent and returns the pending manifest.
      parameters:
        - $ref: '#/components/parameters/takeId'
      responses:
        '200':
          description: The manifest with `combined.state` `pending`; watch for the `take` event to see `complete`/`failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
        '400':
          description: >
            More than one video stream (code `combine_requires_single_video`),
            or the take has no files to combine (code `nothing_to_combine`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The take is still recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 17, method: POST, path: /takes/20260912T040433-fd9q/combine }
        response: { id: 17, status: 200, body: { id: 20260912T040433-fd9q, combined: { path: combined.mov, state: pending } } }
  /token/rotate:
    post:
      operationId: rotateToken
      summary: Issue a new bearer token; the old one stops working after this response.
      responses:
        '200':
          description: The new token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                additionalProperties: false
                properties:
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-ws:
        request: { id: 15, method: POST, path: /token/rotate }
        response: { id: 15, status: 200, body: { token: 9f3c00112233445566778899aabbccddeeff00112233445566778899aabbccdd } }
  /preview/{stream}:
    get:
      operationId: preview
      summary: One preview frame, on demand. Nothing is captured when nobody is looking; one preview at a time.
      description: >
        A polite second opener grabs a single frame and closes the device, so
        preview never disturbs an armed or recording take. Video streams answer
        a small JPEG (longest side 640); audio streams answer the current peak
        level as JSON, for the popover's meter.
      parameters:
        - name: stream
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A JPEG for video streams, or a JSON level for audio streams.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                required: [levelDb]
                additionalProperties: false
                properties:
                  levelDb:
                    type: number
                    description: Peak dBFS of a short sample.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The device delivered no frame to preview (code `no_frame`), or is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ws:
        request: { id: 16, method: GET, path: '/preview/display:56A96CFC-7F21-168E-0857-D6964E3302DB' }
        response: { id: 16, status: 200, contentType: image/jpeg, base64: '/9j/4AAQSk…' }
  /events:
    get:
      operationId: events
      summary: The Server-Sent Events stream — every event, one-way.
      description: >
        `text/event-stream`; each event is one `data: <json>` line (see
        x-events). `EventSource` cannot set headers, so the bearer token is
        accepted as `?access_token=` here as well as in the Authorization
        header. The same events reach every authenticated WebSocket client.
      security:
        - bearer: []
        - accessToken: []
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
          description: The bearer token, for EventSource which cannot set a header.
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    takeId:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        The token in ~/Library/Application Support/Rheocles/token. Also accepted
        as ?access_token= on GET /events, for EventSource.
    accessToken:
      type: apiKey
      in: query
      name: access_token
      description: The same bearer token as a query parameter, for EventSource.
  responses:
    BadRequest:
      description: Malformed or missing JSON body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such stream or take.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No token, or the wrong one.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer realm="Rheocles"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: One shape on every route and both transports.
      required: [error, code]
      additionalProperties: false
      properties:
        error:
          type: string
          description: For humans.
        code:
          type: string
          description: Stable, for programs.
          enum:
            - bad_request
            - unauthorized
            - permission_denied
            - not_found
            - method_not_allowed
            - conflict
            - take_active
            - write_failed
            - internal
            - unsupported
            - device_unavailable
            - insufficient_storage
            - combine_requires_single_video
            - nothing_to_combine
    StreamList:
      type: object
      required: [streams, permissions]
      additionalProperties: false
      properties:
        streams:
          type: array
          items:
            $ref: '#/components/schemas/Stream'
        permissions:
          $ref: '#/components/schemas/Permissions'
    Stream:
      type: object
      required: [id, kind, name, model, capabilities, armed]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable and URL-safe, `<kind>:<identifier>`. Clients hold this.
          pattern: '^(display|window|camera|microphone|systemAudio):[A-Za-z0-9._-]+$'
        kind:
          type: string
          enum: [display, window, camera, microphone, systemAudio]
        name:
          type: string
          description: What the user calls it.
        model:
          type: string
          description: What the hardware calls itself, or the owning application for a window.
        capabilities:
          type: object
          additionalProperties: false
          properties:
            video:
              type: object
              required: [width, height, maxFrameRate]
              additionalProperties: false
              properties:
                width:
                  type: integer
                  description: Native pixels.
                height:
                  type: integer
                maxFrameRate:
                  type: number
                  description: The highest advertised rate; the signal's real rate can be lower.
            audio:
              type: object
              required: [sampleRate, channels]
              additionalProperties: false
              properties:
                sampleRate:
                  type: number
                channels:
                  type: integer
        armed:
          type: boolean
          description: Whether the capture session is live.
        active:
          type: object
          description: What the device is actually delivering; present only while armed.
          additionalProperties: false
          properties:
            video:
              type: object
              required: [width, height, maxFrameRate]
              additionalProperties: false
              properties:
                width:
                  type: integer
                height:
                  type: integer
                maxFrameRate:
                  type: number
            audio:
              type: object
              required: [sampleRate, channels]
              additionalProperties: false
              properties:
                sampleRate:
                  type: number
                channels:
                  type: integer
        framesSeen:
          type: integer
          description: Frames or audio buffers delivered since arming; present only while armed.
    Permissions:
      type: object
      description: >
        What macOS has let this process do. Screen Recording gates displays and
        windows both; with `screen` anything but `authorized` the list has none.
      required: [camera, microphone, screen]
      additionalProperties: false
      properties:
        camera:
          $ref: '#/components/schemas/PermissionStatus'
        microphone:
          $ref: '#/components/schemas/PermissionStatus'
        screen:
          $ref: '#/components/schemas/PermissionStatus'
    PermissionStatus:
      type: string
      enum: [authorized, denied, restricted, notDetermined]
    TakeRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        destination:
          type: string
          description: Take folder relative to the output root. Default `takes/<yyyy-MM-dd>/<HHmmss>[-<name>]`.
        files:
          type: object
          description: File name per stream id, relative to the take folder.
          additionalProperties:
            type: string
        codec:
          type: string
          enum: [hevc, prores]
        expectedDuration:
          type: number
          description: Seconds, for the disk pre-flight. Default 1800.
        overwrite:
          type: boolean
          description: Reuse a destination that already exists. Never silently suffixed.
        combine:
          type: boolean
          description: >
            Write a single passthrough-muxed `combined.mov` (the one video, if any,
            plus every audio stream as its own track) when the take stops. Defaults
            to `settings.combine`. Requires at most one video stream.
    TakeCreated:
      type: object
      required: [take, warnings]
      additionalProperties: false
      properties:
        take:
          $ref: '#/components/schemas/Manifest'
        warnings:
          type: array
          items:
            type: string
    TakeSummary:
      type: object
      required: [id, state, created, destination, streams]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/TakeState'
        created:
          type: string
          format: date-time
        destination:
          type: string
        streams:
          type: integer
        combined:
          $ref: '#/components/schemas/Combined'
    Combined:
      type: object
      description: >
        The passthrough-muxed `combined.mov`, present only when the take was
        created with `combine` (or one was run after the fact). `state`
        advances from `pending` to `complete` or `failed`; completion arrives
        as a `take` event. A failed combine never marks the take incomplete.
      required: [path, state]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Combined file, relative to the take folder.
        state:
          type: string
          enum: [pending, complete, failed]
        reason:
          type: string
          description: Present only when `failed`.
    TakeState:
      type: string
      enum: [created, recording, complete, incomplete]
    Manifest:
      type: object
      description: The manifest is the take. Rewritten atomically on every state change.
      required: [id, state, created, outputRoot, destination, version, machine, streams, markers, settings]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        state:
          $ref: '#/components/schemas/TakeState'
        reason:
          type: string
          description: Present only when `incomplete`.
        created:
          type: string
          format: date-time
        started:
          type: string
          format: date-time
        stopped:
          type: string
          format: date-time
        outputRoot:
          type: string
          description: Absolute, as it was at create.
        destination:
          type: string
          description: Take folder, relative to the output root.
        version:
          type: string
        machine:
          type: object
          required: [hostname, machineId]
          additionalProperties: false
          properties:
            hostname:
              type: string
            machineId:
              type: string
        streams:
          type: array
          items:
            $ref: '#/components/schemas/ManifestStream'
        markers:
          type: array
          items:
            type: object
            required: [t, label]
            additionalProperties: false
            properties:
              t:
                type: number
                description: Seconds from the cue.
              label:
                type: string
        settings:
          type: object
          required: [codec]
          additionalProperties: false
          properties:
            codec:
              type: string
              enum: [hevc, prores]
            expectedDuration:
              type: number
        combined:
          $ref: '#/components/schemas/Combined'
        removed:
          type: boolean
          description: >
            Present and `true` only on the final `take` event for a take that
            recorded nothing and was discarded — superseded before start, or
            still `created` when the daemon stopped. A prepared take lives in
            memory and never reaches disk, so there is no folder to remove. The
            take is `incomplete` with the reason; `removed` tells a client to
            drop it from its list. Never written to disk.
    ManifestStream:
      type: object
      required: [id, kind, name, model, path, codec, format, framesWritten, events]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [display, window, camera, microphone, systemAudio]
        name:
          type: string
        model:
          type: string
        path:
          type: string
          description: Relative to the take folder.
        codec:
          type: string
          description: hevc, prores, or pcm_s24le.
        format:
          type: object
          additionalProperties: false
          properties:
            video:
              type: object
              required: [width, height, maxFrameRate]
              additionalProperties: false
              properties:
                width:
                  type: integer
                height:
                  type: integer
                maxFrameRate:
                  type: number
            audio:
              type: object
              required: [sampleRate, channels]
              additionalProperties: false
              properties:
                sampleRate:
                  type: number
                channels:
                  type: integer
        started:
          type: string
          format: date-time
        stopped:
          type: string
          format: date-time
        timecode:
          type: string
          description: >
            Start timecode HH:MM:SS:FF — the LOCAL time of day (the machine's
            own midnight) of the first written frame, nearest frame. The
            manifest's created/started/stopped are UTC.
        timeReference:
          type: integer
          description: >
            Audio only. BWF TimeReference: samples since LOCAL midnight at the
            first sample — the sample-exact form of `timecode`.
        framesDropped:
          type: integer
          description: Video only. Frames the encoder was not ready for. Absent when zero.
        framesWritten:
          type: integer
        drift:
          type: number
          description: Frames × frame duration versus host elapsed, seconds.
        measuredFrameRate:
          type: number
          description: >
            Video only. The true incoming rate — delivered frames over the host
            span — so a 59.94 source behind a "60" card reads 59.94. Absent for
            audio and until measured.
        events:
          type: array
          items:
            type: object
            required: [t, type]
            additionalProperties: false
            properties:
              t:
                type: number
              type:
                type: string
                enum: [join, leave]
        error:
          type: string
    StreamRef:
      type: object
      required: [stream]
      additionalProperties: false
      properties:
        stream:
          type: string
    Settings:
      type: object
      required: [outputRoot, codec, combine]
      additionalProperties: false
      properties:
        outputRoot:
          type: string
          description: Absolute path new takes land under.
        codec:
          type: string
          enum: [hevc, prores]
        combine:
          type: boolean
          description: Default for a take's `combine` option — write a single `combined.mov` alongside the per-stream files.
    Discovery:
      type: object
      required: [name, version, hostname, machineId, outputRoot, auth, ports]
      additionalProperties: false
      properties:
        name:
          type: string
          const: Rheocles
        version:
          type: string
        hostname:
          type: string
        machineId:
          type: string
          description: The kernel host UUID; stable across renames and reboots.
        outputRoot:
          type: string
          description: The one absolute path in the API. Every other path is relative to it.
        freeBytes:
          type: integer
          format: int64
          description: >
            Bytes available for important usage on the output root's volume.
            Absent when unmeasurable — absent means unknown, never zero.
        auth:
          type: string
          const: bearer
        ports:
          type: object
          required: [http, ws]
          additionalProperties: false
          properties:
            http:
              type: integer
            ws:
              type: integer
